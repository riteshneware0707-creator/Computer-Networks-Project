frr defaults traditional
hostname r1
service integrated-vtysh-config
ip forwarding
!
interface eth1
 ip address 10.0.1.1/24
 ip ospf area 0
!
interface eth2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf cost 10
!
interface eth3
 ip address 10.0.13.1/30
 ip ospf area 0
 ip ospf cost 20
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface eth1
!
